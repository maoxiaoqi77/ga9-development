const architectGuide={
en:{title:"Who can submit the official plans?",desc:"For building applications involving non-exempt building work, engage a qualified Entwurfsverfasser with Bauvorlageberechtigung under Berlin Building Code §65. Registered architects and engineers entered in the relevant Baukammer list generally qualify; statutory exceptions and special scopes exist. A concept sketch prepared by the owner does not replace official Bauvorlagen.",verify:"Before signing, ask for the architect's register details or the engineer's Bauvorlageberechtigung, professional liability insurance, Berlin use-change / attic-conversion references, and confirmation that preparation and submission of the Bauantrag are included.",scope:"Suggested initial commission: feasibility and planning through HOAI phases 1–4; commission detailed design / tendering / construction supervision (5–8) separately if needed."},
de:{title:"Wer darf Bauvorlagen einreichen?",desc:"Für genehmigungspflichtige Bauvorhaben ist grundsätzlich ein bauvorlageberechtigter Entwurfsverfasser gemäß § 65 BauO Bln erforderlich. Berechtigt sind insbesondere Architektinnen/Architekten und entsprechend eingetragene Ingenieurinnen/Ingenieure; gesetzliche Ausnahmen und begrenzte Befugnisse sind zu beachten. Private Konzeptskizzen ersetzen keine Bauvorlagen.",verify:"Vor Beauftragung: Kammer- oder Listeneintrag, Bauvorlageberechtigung, Berufshaftpflicht, Referenzen in Berlin und Leistungsumfang einschließlich Bauantragstellung prüfen.",scope:"Empfehlung: zunächst Machbarkeit und Genehmigungsplanung (HOAI LPH 1–4) beauftragen; LPH 5–8 bei Bedarf gesondert vereinbaren."},
ja:{title:"正式な建築図面を提出できる専門家",desc:"許可が必要な建築工事では、ベルリン建築条例 §65 に基づく Bauvorlageberechtigung（建築申請図面提出資格）を持つ設計責任者が原則必要です。登録建築家や該当名簿に登録された技術者などが対象で、例外や資格範囲の制限もあります。施主の構想図は正式申請図面の代わりになりません。",verify:"依頼前に登録情報、提出資格、専門職賠償責任保険、ベルリンでの用途変更・屋根裏改修実績、申請手続きが契約に含まれるかを確認。",scope:"まず可能性調査から許可申請設計まで（HOAI 1～4段階）を委託し、詳細設計・入札・現場監理（5～8段階）は必要に応じて別契約。"},
ko:{title:"공식 건축도면 제출 자격",desc:"허가가 필요한 건축공사의 경우 베를린 건축법 §65에 따른 Bauvorlageberechtigung(건축도서 제출 자격)을 갖춘 설계 책임자가 원칙적으로 필요합니다. 등록 건축사 또는 해당 명부에 등록된 기술자가 해당할 수 있으며 법적 예외와 업무 범위 제한도 있습니다. 소유자가 만든 개념도는 공식 신청도서를 대체하지 못합니다.",verify:"계약 전에 등록번호와 제출 자격, 전문직 배상책임보험, 베를린 용도변경·다락층 공사 경험 및 인허가 신청 포함 여부를 확인하세요.",scope:"먼저 타당성 검토와 인허가 설계(HOAI 1~4단계)를 맡기고, 상세설계·입찰·시공감리(5~8단계)는 필요에 따라 별도 계약할 수 있습니다."},
zh:{title:"谁有资格提交正式建筑申请图纸？",desc:"按照柏林《建筑条例》§65，需要正式审批的建筑工程原则上应由具有 Bauvorlageberechtigung（建筑报批图纸提交资格）的设计负责人制作 Bauvorlagen。依法可以使用建筑师头衔的建筑师，以及符合规定并列入相应名录的工程师等通常具备资格，但也存在法定例外及限制。业主自行绘制的概念图不能代替正式报批图纸。",verify:"签约前请核对建筑师协会注册信息或工程师 Bauvorlageberechtigung、职业责任保险、柏林用途变更及阁楼改建经验，并确认报价是否包含编制和提交 Bauantrag。",scope:"建议先委托可行性研究及审批设计（HOAI 阶段 1–4），施工图、招标和施工监督（阶段 5–8）按需要另行约定。"}

const detailedArchitect = {"en":["Architect and permit responsibilities","A permit-submission-qualified designer (bauvorlageberechtigter Entwurfsverfasser) is generally required for non-exempt building works under §65 BauO Bln. Verify authorization—not just an architecture diploma. Certain simple works and special exceptions are governed separately.","Before signing: verify Architektenkammer/Baukammer registration, proof of Bauvorlageberechtigung, professional liability coverage, Berlin approval experience, and whether official submissions / replies to authority requests are included.","Commission feasibility and approvals design (typically HOAI LPH 1–4) first; detailed drawings, tendering and construction supervision (LPH 5–8) can follow separately.","Project specialists","Restaurant: licensed submission designer coordinating commercial-kitchen planner, mechanical ventilation/exhaust specialist, fire-safety specialist, acoustics and grease/wastewater assessment as required. Confirm hot-kitchen equipment, exhaust route and residential odour protection BEFORE filing.","Remise: submission designer to investigate lawful existing use; fire/ventilation and occupational safety specialists as required by materials, processes and actual works. No public access does not automatically exempt a permit.","Attic: submission designer, structural engineer (Statiker), fire-safety/escape-route specialist, energy adviser and service engineers as needed. Evaluate roof loads, stairs, second escape path and structural feasibility before full drawings.","What the architect should deliver","Written feasibility opinion for each space, existing-vs-proposed use plans, measured drawings, regulatory constraints, submission-ready plans (Bauvorlagen), coordinated consultant evidence, clear list of permits and a response plan for deficiencies.","Ask this when requesting a quote","Sind Sie in Berlin bauvorlageberechtigt? Können Sie für die drei Vorhaben die Bestandsprüfung, Nutzungsänderungen, Genehmigungsplanung und Bauantragstellung übernehmen? Welche Fachplaner und HOAI-Leistungsphasen sind im Honorar enthalten?"],"de":["Architekt und Bauantragsverantwortung","Für nicht verfahrensfreie Bauvorhaben ist grundsätzlich ein bauvorlageberechtigter Entwurfsverfasser nach §65 BauO Bln erforderlich. Ein Studienabschluss allein reicht nicht; gesetzliche Ausnahmen gelten.","Vor Vertragsabschluss: Kammer-/Listeneintrag, Bauvorlageberechtigung, Berufshaftpflicht, Berliner Genehmigungsreferenzen sowie Antragstellung und Nachforderungen prüfen.","Zuerst Machbarkeitsprüfung und Genehmigungsplanung (in der Regel HOAI LPH 1–4), weitere Planung/Ausschreibung/Bauüberwachung (LPH 5–8) gesondert vereinbaren.","Fachplaner je Projekt","Restaurant: bauvorlageberechtigte Planung, Küchenplanung, Abluft-/TGA-Fachplanung, Brandschutz, ggf. Schallschutz und Fettabscheider/Entwässerung. Warme Küche und Abluftführung früh klären.","Remise: genehmigten Bestand prüfen; bei Bedarf Brandschutz, Lüftung und Arbeitsschutz für Materialien und Werkprozesse. Kein Publikumsverkehr bedeutet nicht automatisch Genehmigungsfreiheit.","Dachgeschoss: Architekt/Entwurfsverfasser, Tragwerksplaner, Brandschutzfachplanung, Energieberatung und TGA nach Bedarf. Tragwerk, Treppe und zweiten Rettungsweg vor Detailplanung prüfen.","Erwartete Leistungen","Schriftliche Machbarkeit pro Raum, Bestands- und Zielnutzung, Aufmaß, Genehmigungspläne, Koordination der Fachnachweise, Genehmigungspfad und Bearbeitung von Nachforderungen.","Frage für die Angebotsanfrage","Sind Sie in Berlin bauvorlageberechtigt? Können Sie für die drei Vorhaben die Bestandsprüfung, Nutzungsänderungen, Genehmigungsplanung und Bauantragstellung übernehmen? Welche Fachplaner und HOAI-Leistungsphasen sind im Honorar enthalten?"],"ja":["建築家の資格と申請責任","ベルリン建築条例§65では、原則として許可が必要な建築工事の申請図書に提出資格（Bauvorlageberechtigung）を持つ設計責任者が必要です。建築学の学位だけでは十分ではなく、法定例外もあります。","契約前に職能団体登録、申請図面提出資格、職業賠償責任保険、ベルリンでの許可実績、申請および補正対応が業務に含まれるか確認。","最初は可能性調査と許可申請設計（通常 HOAI 1–4段階）を委託し、詳細設計・入札・施工監理（5–8段階）は別途契約可能。","案件ごとに必要な専門家","レストラン：有資格設計者、業務厨房設計、排気・設備設計、消防、必要に応じ防音と油脂分離・排水の専門家。温厨房の排気経路を申請前に確認。","Remise：既存の正式許可用途を調査する設計者。作業工程・材料に応じて消防、換気、労働安全の専門家。非公開でも必ずしも許可不要ではありません。","屋根裏住宅：設計者、構造技術者、消防・避難設計、エネルギー・設備の専門家。屋根荷重、階段、第二避難経路を先に確認。","建築家に求める成果物","各空間の実現可能性レポート、現況と計画用途の図面、実測図、制約条件、正式申請図書、各専門家の資料調整、補正対応。","見積時に確認する文言","Sind Sie in Berlin bauvorlageberechtigt? Können Sie für die drei Vorhaben die Bestandsprüfung, Nutzungsänderungen, Genehmigungsplanung und Bauantragstellung übernehmen? Welche Fachplaner und HOAI-Leistungsphasen sind im Honorar enthalten?"],"ko":["건축사 자격과 인허가 책임","베를린 건축법 §65에 따라 허가가 필요한 공사의 신청도서는 원칙적으로 Bauvorlageberechtigung(건축도서 제출 자격)이 있는 설계 책임자가 작성해야 합니다. 학위만으로는 충분하지 않으며 법적 예외가 있습니다.","계약 전에 건축사회/기술사회 등록, 제출 자격, 전문직 책임보험, 베를린 인허가 실적, 신청 및 보완자료 대응 범위를 확인하세요.","우선 타당성 조사와 인허가 설계(통상 HOAI 1–4단계)를 의뢰하고 상세설계·입찰·시공감리(5–8단계)는 별도 계약 가능합니다.","사업별 추가 전문 인력","레스토랑: 자격 있는 설계자, 상업용 주방 설계, 환기·배기 설계, 소방, 필요한 경우 방음 및 유지분리·배수 전문가. 온조리 주방의 배기 경로부터 확인.","Remise: 기존 합법 용도를 확인할 설계자. 재료·공정에 따라 소방, 환기, 작업안전 전문가. 공개하지 않는다고 자동으로 허가 면제되는 것은 아닙니다.","다락층: 설계자, 구조기술자, 소방·피난 전문가, 에너지 및 설비 전문가. 지붕 하중, 계단, 두 번째 피난로를 우선 점검.","건축사에게 받을 결과물","공간별 타당성 보고서, 기존/계획 용도 도면, 실측도, 법규 검토, 공식 신청도서, 전문자료 조정, 보완 요청 대응 계획.","견적 요청 시 질문","Sind Sie in Berlin bauvorlageberechtigt? Können Sie für die drei Vorhaben die Bestandsprüfung, Nutzungsänderungen, Genehmigungsplanung und Bauantragstellung übernehmen? Welche Fachplaner und HOAI-Leistungsphasen sind im Honorar enthalten?"],"zh":["建筑师资质与报批责任","根据《柏林建筑条例》§65，需要审批的建筑施工原则上应由具备 Bauvorlageberechtigung（建筑报批图纸提交资格）的设计负责人编制正式申请图纸。仅有建筑学学历并不等于具有提交资格；法律规定的简单工程等存在例外。","签约前必须核对：Architektenkammer 或 Baukammer 注册资料、报批资格、职业责任保险、柏林用途变更/阁楼改建案例，以及报价是否涵盖正式 Bauantrag 提交、补件和主管部门沟通。","建议第一份合同只覆盖可行性研究、设计及审批申请（通常 HOAI 工作阶段 1–4）；施工图、招标和现场监督（阶段 5–8）可以另签。","三个项目分别需要哪些专业人员？","餐厅：具备报批资格的建筑师统筹，配合商业厨房设计师、暖通排烟工程师、消防顾问；视情况增加隔音、隔油池/排水顾问。必须先确认热餐厨房的排烟路线、油烟气味控制，再进行完整申报。","Remise：建筑师先核实院内建筑合法性及历史批准用途。视制作材料、机械设备和实际施工，进一步安排消防、通风及工作安全专业人员。即使不接待公众，也不代表自动免许可。","阁楼：建筑师 + 结构工程师（Statiker）+ 消防/第二逃生通道顾问；需要时增加能源节能和给排水暖通设计。优先检查屋顶和楼板承重、楼梯、第二逃生路径，再画完整公寓图。","应该要求建筑师交付什么？","三处空间分别出具书面可行性判断、现状与计划用途图、实测图、法规障碍清单、报批图纸（Bauvorlagen）、专业报告协调、申请路径及补件处理方案。","可直接发给建筑师的询价问题","Sind Sie in Berlin bauvorlageberechtigt? Können Sie für die drei Vorhaben die Bestandsprüfung, Nutzungsänderungen, Genehmigungsplanung und Bauantragstellung übernehmen? Welche Fachplaner und HOAI-Leistungsphasen sind im Honorar enthalten?"]};

zh:{hero:"三个空间，三条审批路径。",sub:"GA9 项目实操指南：原歌唱学校改热餐厨房餐厅、Remise 改非公开艺术制作工作室、空置阁楼改公寓。",overview:"项目概览",intro:"首先核实各空间在法律上批准的现有用途，三个项目的前期调查可以同时进行。",caution:"重要：收益及负担转移不等于 Grundbuch 产权过户。正式 Bauantrag / Bauvorbescheid 申请须处理当前登记业主的书面同意。所有时间仅为规划估算，不是官方承诺。",projects:[["餐厅","原歌唱学校 → 配热餐厨房的正式餐厅。重点审查排烟、气味、油脂分离器、消防和食品卫生。"],["艺术工作室","Remise → 仅制作作品的非公开工作室，不接待公众、不办展览、不居住。此前私人仓储并不证明依法获批。"],["阁楼公寓","空置阁楼 → 住宅。需要核实结构、逃生通道、采光、保温和城市规划限制。"]],workflow:"逐步申请路线图",workflowIntro:"点击选择项目。每一步都列明要做什么、准备什么、联系哪个部门、预计要多久。",directory:"官方联系人及网站",checktitle:"共同准备清单",checkintro:"勾选进度只保存在当前浏览器。",checks:["取得 Grundbuch 登记业主的书面同意","向档案馆申请三个空间的 Bauakte","整理买卖合同和交接文件","委托建筑师现场测量与考察","核实历史许可和用途规划","与 Bauaufsicht 预约预沟通","确认各项目范围、预算与负责人","准备有针对性的 Bauvorbescheid 问题"],footer:"本网站为初步项目协调指南，不代表主管部门决定或法律意见。正式材料和期限以 Pankow 审批部门确认为准。",labels:["要做什么","准备材料","联系部门","预计时间","官方网站"],done:"已完成 {n}/{total} 项",reset:"已清除本机进度。",print:"若没有弹出打印窗口，请按 Ctrl/Cmd + P。",

function escapeHTML(v){return String(v).replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]))}
function tr(){return lang==="en"?en:langData[lang]}function contactHtml(ids){return ids.split(",").map(id=>{let c=contacts.find(q=>q.id===id);return '<div><strong>'+escapeHTML(c.name)+'</strong>'+(c.person?' · '+escapeHTML(c.person):'')+(c.phone?'<div><a href="tel:'+c.phone.replaceAll(" ","")+'">'+escapeHTML(c.phone)+'</a></div>':'')+(c.email?'<div><a href="mailto:'+escapeHTML(c.email)+'">'+escapeHTML(c.email)+'</a></div>':'')+'<div><a target="_blank" rel="noopener noreferrer" href="'+c.url+'">'+escapeHTML(detailsLabels[lang][8])+' ↗</a></div></div>'}).join("")}
function render(){let g=architectGuide[lang]||architectGuide.en;let q=detailedArchitect[lang]||detailedArchitect.en,lab=detailsLabels[lang]||detailsLabels.en;document.getElementById("architect-guidance").innerHTML='<div class="notice"><h2>'+escapeHTML(g.title)+'</h2><p>'+escapeHTML(g.desc)+'</p><p><strong>✓</strong> '+escapeHTML(g.verify)+'</p><p>'+escapeHTML(g.scope)+'</p>'+architectLinks.map(l=>'<p><a target="_blank" rel="noopener noreferrer" href="'+l.url+'">'+escapeHTML(l.name)+' ↗</a></p>').join('')+'<div class="resource" style="margin-top:18px"><h3>'+escapeHTML(q[0])+'</h3><p>'+escapeHTML(q[1])+'</p><h3>'+escapeHTML(lab[1])+'</h3><p>'+escapeHTML(q[2])+'</p><h3>'+escapeHTML(lab[2])+'</h3><p>'+escapeHTML(q[3])+'</p><h3>'+escapeHTML(q[4])+'</h3><p>'+escapeHTML(q[5])+'</p><p>'+escapeHTML(q[6])+'</p><p>'+escapeHTML(q[7])+'</p><h3>'+escapeHTML(q[8])+'</h3><p>'+escapeHTML(q[9])+'</p><h3>'+escapeHTML(q[10])+'</h3><p>'+escapeHTML(q[11])+'</p><p><a target="_blank" rel="noopener noreferrer" href="https://www.berlin.de/sen/stadt/service/rechtsvorschriften/bereich-bauen/bauaufsicht/gesetze/">'+escapeHTML(lab[6])+' ↗</a></p></div>'+'</div>';let t=tr();document.documentElement.lang=lang;document.querySelectorAll("[data-lang]").forEach(b=>{b.classList.toggle("active",b.dataset.lang===lang);b.setAttribute("aria-pressed",String(b.dataset.lang===lang))});["hero","sub","overview","intro","caution","workflow","workflowIntro","directory","checktitle","checkintro","footer"].forEach(k=>$(k).textContent=t[k]);$("date").textContent=uiLabels[lang].updated;$("print").textContent=uiLabels[lang].print;$("clear").textContent=uiLabels[lang].clear;$("projects").innerHTML=t.projects.map((p,i)=>'<article class="project"><div class="number">0'+(i+1)+'</div><h3>'+escapeHTML(p[0])+'</h3><p>'+escapeHTML(p[1])+'</p></article>').join("");$("tabs").innerHTML=t.projects.map((p,i)=>'<button aria-pressed="'+(i===active)+'" class="'+(i===active?'active':'')+'" data-project="'+i+'">'+escapeHTML(p[0])+'</button>').join("");$("steps").innerHTML=t.steps[active].map((s,i)=>'<article class="step"><div class="stephead"><div class="circle">'+(i+1)+'</div><h3>'+escapeHTML(s[0])+'</h3></div><p class="bodytext">'+escapeHTML(s[1])+'</p><div class="step-duration"><span class="caption">'+escapeHTML(t.labels[3])+'</span><strong>'+escapeHTML(s[4])+'</strong><span class="small">'+escapeHTML(detailsLabels[lang][7])+'</span></div><div class="details"><div class="detail"><div class="caption">'+escapeHTML(t.labels[1])+'</div>'+escapeHTML(s[2])+'</div><div class="detail"><div class="caption">'+escapeHTML(t.labels[2])+'</div>'+contactHtml(s[3])+'</div></div></article>').join("");$("resources").innerHTML=contacts.map(c=>'<div class="resource"><strong>'+escapeHTML(c.name)+'</strong><small>'+escapeHTML(c.person)+'</small>'+(c.phone?'<span><a href="tel:'+c.phone.replaceAll(" ","")+'">'+escapeHTML(c.phone)+'</a></span>':'')+(c.email?'<span><a href="mailto:'+escapeHTML(c.email)+'">'+escapeHTML(c.email)+'</a></span>':'')+'<a target="_blank" rel="noopener noreferrer" href="'+c.url+'">'+escapeHTML(detailsLabels[lang][8])+' ↗</a></div>').join("");$("checks").innerHTML=t.checks.map((s,i)=>'<label class="check"><input data-check="'+i+'" type="checkbox" '+(localStorage.getItem("ga9-"+i)==="1"?"checked":"")+'> '+escapeHTML(s)+'</label>').join("");$("tabs").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{active=+b.dataset.project;render();$("workflow").scrollIntoView({behavior:"smooth",block:"start"})}));$("checks").querySelectorAll("input").forEach(c=>c.addEventListener("change",()=>{localStorage.setItem("ga9-"+c.dataset.check,c.checked?"1":"0");progress()}));progress()}
function progress(){let t=tr(),n=t.checks.filter((_,i)=>localStorage.getItem("ga9-"+i)==="1").length;$("progress").textContent=t.done.replace("{n}",n).replace("{total}",t.checks.length)}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;localStorage.setItem("ga9-lang",lang);render()}));$("print").onclick=()=>{let t=tr();$("feedback").textContent=t.print;try{window.print()}catch(e){}};$("clear").onclick=()=>{for(let i=0;i<8;i++)localStorage.removeItem("ga9-"+i);render();$("feedback").textContent=tr().reset};render();
</script></body></html>
